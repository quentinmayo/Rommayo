name: Release apps
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage --x64
            name: linux
          - os: windows-latest
            target: --win nsis --x64
            name: windows
          - os: macos-latest
            target: --mac dmg --arm64
            name: macos
          - os: macos-15-intel
            target: --mac dmg --x64
            name: macos-intel
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release key
        env:
          ROMMAYO_KEYSTORE_BASE64: ${{ secrets.ROMMAYO_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'rommayo-release.p12'
          key.write_bytes(base64.b64decode(os.environ['ROMMAYO_KEYSTORE_BASE64']))
          key.chmod(0o600)
          PY
      - name: Build signed APK
        working-directory: android
        env:
          ROMMAYO_KEYSTORE: ${{ runner.temp }}/rommayo-release.p12
          ROMMAYO_STORE_PASSWORD: ${{ secrets.ROMMAYO_STORE_PASSWORD }}
          ROMMAYO_KEY_ALIAS: ${{ secrets.ROMMAYO_KEY_ALIAS }}
          ROMMAYO_KEY_PASSWORD: ${{ secrets.ROMMAYO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Rommayo-${GITHUB_REF_NAME}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Rommayo-*-android.apk
      - if: always()
        run: rm -f "$RUNNER_TEMP/rommayo-release.p12"
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish public alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "Rommayo $GITHUB_REF_NAME · Public Alpha" --prerelease --notes-file ../docs/release-notes.md
          fi
